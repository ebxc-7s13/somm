name: Android APK

# Builds a signed APK of the Capacitor shell in the cloud: nothing to install locally.
# Needs the repository variable SOMM_APP_URL (the deployed https origin) and the
# secrets SOMM_KEYSTORE_BASE64 + SOMM_KEYSTORE_PASSWORD. See docs/DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Server URL for this build (leave empty to use the SOMM_APP_URL variable)
        required: false
        default: ''
      publish:
        description: Publish the APK as a GitHub release (otherwise it is only kept as a 30-day artifact)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - android/**
      - mobile/**
      - capacitor.config.ts
      - scripts/prepare-mobile.mjs
      - .github/workflows/android.yml

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    # On pushes, wait until the app has been deployed and its URL configured.
    if: ${{ vars.SOMM_APP_URL != '' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOMM_APP_URL: ${{ inputs.app_url || vars.SOMM_APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        env:
          HAS_KEYSTORE: ${{ secrets.SOMM_KEYSTORE_BASE64 != '' && secrets.SOMM_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ -z "$SOMM_APP_URL" ]; then
            echo "::error::Set the repository variable SOMM_APP_URL to the deployed https URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Add the SOMM_KEYSTORE_BASE64 and SOMM_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      - name: Sync the web shell into the Android project
        run: node scripts/prepare-mobile.mjs && npx cap sync android

      - name: Restore the signing key
        env:
          SOMM_KEYSTORE_BASE64: ${{ secrets.SOMM_KEYSTORE_BASE64 }}
        run: |
          echo "$SOMM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/somm-release.p12"
          echo "SOMM_KEYSTORE_PATH=$RUNNER_TEMP/somm-release.p12" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          SOMM_KEYSTORE_PASSWORD: ${{ secrets.SOMM_KEYSTORE_PASSWORD }}
          SOMM_KEY_ALIAS: somm
          SOMM_VERSION_CODE: ${{ github.run_number }}
          SOMM_VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          # Capture first so a failed verification fails the step (a pipe would hide its exit code).
          CERTS=$("$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK")
          echo "$CERTS" | head -3
          # A fixed file name keeps the "latest release" download link stable.
          cp "$APK" somm-android.apk
          rm -f "$RUNNER_TEMP/somm-release.p12"

      - uses: actions/upload-artifact@v5
        with:
          name: somm-android-${{ github.run_number }}
          path: somm-android.apk
          retention-days: 30

      - name: Publish as a GitHub release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256=$(sha256sum somm-android.apk | cut -d' ' -f1)
          SIZE=$(du -k somm-android.apk | cut -f1)
          cat > notes.md <<NOTES
          The SOMM Android app (version 0.1.${{ github.run_number }}). It opens **${SOMM_APP_URL}** — the same site as the web version, so every website update reaches the app without reinstalling.

          **Install**
          1. On your Android phone, download **somm-android.apk** below (${SIZE} KB).
          2. Open it. If Android asks, allow your browser or file manager to install apps.
          3. Open SOMM, then sign up, sign in or tap **Try the demo**.

          Updates install over the previous version (same signing key). The server stays awake around the clock; if the app shows “Can’t reach SOMM right now”, check the phone's connection, or wait about a minute while the server restarts after an update, and tap **Try again**.

          Prefer not to install anything? Open ${SOMM_APP_URL} in your browser and use **Install app** / **Add to Home Screen**.

          SHA-256 of the APK: \`${SHA256}\`
          NOTES
          gh release create "android-${{ github.run_number }}" somm-android.apk \
            --target "${{ github.sha }}" --latest \
            --title "SOMM for Android 0.1.${{ github.run_number }}" \
            --notes-file notes.md
